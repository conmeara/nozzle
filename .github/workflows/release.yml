name: Build and Release

on:
  push:
    tags:
      - 'v*'

env:
  SCHEME: nozzle
  PROJECT: nozzle.xcodeproj
  BUILD_PATH: build/Build/Products/Release
  APP_NAME: nozzle.app
  ZIP_NAME: nozzle.app.zip
  DMG_NAME: nozzle.dmg

jobs:
  build-and-release:
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Import Developer ID certificate
        env:
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "$DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # Set key partition list for codesigning
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add keychain to search list
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

          # Verify certificate is available
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME"

      - name: Build and sign
        env:
          DEVELOPER_TEAM_ID: ${{ secrets.DEVELOPER_TEAM_ID }}
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$DEVELOPER_TEAM_ID" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            OTHER_CODE_SIGN_FLAGS="--timestamp"

      - name: Re-sign Sparkle framework for notarization
        run: |
          # Re-sign all Sparkle components with Developer ID and timestamp
          SPARKLE_PATH="$BUILD_PATH/$APP_NAME/Contents/Frameworks/Sparkle.framework"

          # Sign nested XPC services first
          for xpc in "$SPARKLE_PATH/Versions/B/XPCServices"/*.xpc; do
            codesign --force --sign "Developer ID Application" --timestamp --options runtime "$xpc"
          done

          # Sign Autoupdate
          codesign --force --sign "Developer ID Application" --timestamp --options runtime "$SPARKLE_PATH/Versions/B/Autoupdate"

          # Sign Updater.app
          codesign --force --sign "Developer ID Application" --timestamp --options runtime "$SPARKLE_PATH/Versions/B/Updater.app"

          # Sign the framework itself
          codesign --force --sign "Developer ID Application" --timestamp --options runtime "$SPARKLE_PATH"

          # Re-sign the main app bundle to update seal
          codesign --force --sign "Developer ID Application" --timestamp --options runtime --entitlements nozzle/nozzle.entitlements "$BUILD_PATH/$APP_NAME"

      - name: Verify code signature
        run: |
          codesign --verify --deep --strict --verbose=2 "$BUILD_PATH/$APP_NAME"
          # Display signing info
          codesign -dv --verbose=4 "$BUILD_PATH/$APP_NAME"
          # Check for get-task-allow (should not be present)
          if codesign -d --entitlements - "$BUILD_PATH/$APP_NAME" 2>&1 | grep -q "get-task-allow"; then
            echo "ERROR: get-task-allow entitlement found in release build!"
            exit 1
          fi
          echo "No get-task-allow entitlement - good for notarization"

      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          DEVELOPER_TEAM_ID: ${{ secrets.DEVELOPER_TEAM_ID }}
        run: |
          # Create zip for notarization
          cd "$BUILD_PATH"
          ditto -c -k --keepParent "$APP_NAME" "notarize.zip"

          # Submit for notarization and capture output
          SUBMIT_OUTPUT=$(xcrun notarytool submit "notarize.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$DEVELOPER_TEAM_ID" \
            --wait 2>&1) || true

          echo "$SUBMIT_OUTPUT"

          # Extract submission ID
          SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | grep "id:" | head -1 | awk '{print $2}')
          echo "Submission ID: $SUBMISSION_ID"

          # Check if notarization succeeded
          if echo "$SUBMIT_OUTPUT" | grep -q "status: Accepted"; then
            echo "Notarization successful!"
          else
            echo "Notarization failed. Fetching log..."
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$DEVELOPER_TEAM_ID" \
              notarization_log.json || true
            cat notarization_log.json
            exit 1
          fi

          # Staple the ticket to the app
          xcrun stapler staple "$APP_NAME"

          # Clean up notarization zip
          rm "notarize.zip"

      - name: Create release zip
        run: |
          cd "$BUILD_PATH"
          ditto -c -k --keepParent "$APP_NAME" "$ZIP_NAME"

      - name: Generate DMG background
        run: |
          cat > /tmp/dmg_bg.swift << 'SWIFT'
          import Cocoa

          let width = 660
          let height = 400
          let cs = CGColorSpaceCreateDeviceRGB()
          guard let ctx = CGContext(data: nil, width: width, height: height,
                                    bitsPerComponent: 8, bytesPerRow: 0, space: cs,
                                    bitmapInfo: CGImageAlphaInfo.premultipliedLast.rawValue) else {
              fputs("Failed to create CGContext\n", stderr)
              exit(1)
          }

          // Gradient background (light gray top to white bottom)
          // Note: CoreGraphics origin is bottom-left
          let gradientColors = [
              CGColor(red: 0.96, green: 0.96, blue: 0.97, alpha: 1.0),
              CGColor(red: 1.0, green: 1.0, blue: 1.0, alpha: 1.0)
          ] as CFArray
          if let gradient = CGGradient(colorsSpace: cs, colors: gradientColors, locations: [0.0, 1.0]) {
              ctx.drawLinearGradient(gradient,
                                     start: CGPoint(x: 0, y: Double(height)),
                                     end: CGPoint(x: 0, y: 0),
                                     options: [])
          }

          // Arrow from app icon area to Applications area
          // Icon centers: app at (180, 170), Applications at (480, 170) in DMG coords
          // In CG coords (flipped): y = height - 170 = 230
          let arrowY = Double(height) - 170.0
          let arrowStartX = 260.0  // Right of app icon
          let arrowEndX = 400.0    // Left of Applications icon
          let arrowColor = CGColor(red: 0.55, green: 0.55, blue: 0.58, alpha: 0.7)

          ctx.setStrokeColor(arrowColor)
          ctx.setLineWidth(2.5)
          ctx.setLineCap(.round)

          // Arrow shaft
          ctx.move(to: CGPoint(x: arrowStartX, y: arrowY))
          ctx.addLine(to: CGPoint(x: arrowEndX, y: arrowY))
          ctx.strokePath()

          // Arrowhead
          ctx.setFillColor(arrowColor)
          ctx.move(to: CGPoint(x: arrowEndX, y: arrowY))
          ctx.addLine(to: CGPoint(x: arrowEndX - 12, y: arrowY + 8))
          ctx.addLine(to: CGPoint(x: arrowEndX - 12, y: arrowY - 8))
          ctx.closePath()
          ctx.fillPath()

          // Hint text below icons
          // In CG coords: y = height - 290 = 110 (below the icons at 170)
          let textY = Double(height) - 310.0
          let text = "Drag nozzle to Applications" as CFString
          let font = CTFontCreateWithName("Helvetica Neue" as CFString, 16, nil)
          let attrs: [CFString: Any] = [
              kCTFontAttributeName: font,
              kCTForegroundColorFromContextAttributeName: true
          ]
          let attrStr = CFAttributedStringCreate(nil, text, attrs as CFDictionary)!
          let line = CTLineCreateWithAttributedString(attrStr)
          let textBounds = CTLineGetBoundsWithOptions(line, .useOpticalBounds)
          let textX = (Double(width) - textBounds.width) / 2.0

          ctx.setFillColor(CGColor(red: 0.45, green: 0.45, blue: 0.48, alpha: 0.85))
          ctx.textPosition = CGPoint(x: textX, y: textY)
          CTLineDraw(line, ctx)

          // Save as PNG
          guard let image = ctx.makeImage() else {
              fputs("Failed to create image\n", stderr)
              exit(1)
          }
          let url = URL(fileURLWithPath: "/tmp/dmg_background.png")
          guard let dest = CGImageDestinationCreateWithURL(url as CFURL, "public.png" as CFString, 1, nil) else {
              fputs("Failed to create image destination\n", stderr)
              exit(1)
          }
          CGImageDestinationAddImage(dest, image, nil)
          guard CGImageDestinationFinalize(dest) else {
              fputs("Failed to write PNG\n", stderr)
              exit(1)
          }
          print("Generated DMG background at /tmp/dmg_background.png")
          SWIFT
          swift /tmp/dmg_bg.swift

      - name: Create DMG installer
        run: |
          cd "$BUILD_PATH"

          # Build volicon args as array (icon name has spaces from asset catalog)
          VOLICON_ARGS=()
          VOLICON=$(find "$APP_NAME/Contents/Resources" -maxdepth 1 -name "*.icns" | head -1)
          if [ -n "$VOLICON" ]; then
            VOLICON_ARGS=(--volicon "$VOLICON")
          fi

          create-dmg \
            --volname "nozzle" \
            "${VOLICON_ARGS[@]}" \
            --background /tmp/dmg_background.png \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 160 \
            --icon "$APP_NAME" 180 170 \
            --hide-extension "$APP_NAME" \
            --app-drop-link 480 170 \
            --no-internet-enable \
            "$DMG_NAME" \
            "$APP_NAME" || test $? -eq 2

      - name: Sign DMG
        run: |
          codesign --force --sign "Developer ID Application" --timestamp "$BUILD_PATH/$DMG_NAME"
          codesign --verify --verbose=2 "$BUILD_PATH/$DMG_NAME"

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          DEVELOPER_TEAM_ID: ${{ secrets.DEVELOPER_TEAM_ID }}
        run: |
          # Submit DMG for notarization
          SUBMIT_OUTPUT=$(xcrun notarytool submit "$BUILD_PATH/$DMG_NAME" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$DEVELOPER_TEAM_ID" \
            --wait 2>&1) || true

          echo "$SUBMIT_OUTPUT"

          # Extract submission ID
          SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | grep "id:" | head -1 | awk '{print $2}')
          echo "Submission ID: $SUBMISSION_ID"

          # Check if notarization succeeded
          if echo "$SUBMIT_OUTPUT" | grep -q "status: Accepted"; then
            echo "DMG notarization successful!"
          else
            echo "DMG notarization failed. Fetching log..."
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$DEVELOPER_TEAM_ID" \
              dmg_notarization_log.json || true
            cat dmg_notarization_log.json
            exit 1
          fi

          # Staple the ticket to the DMG
          xcrun stapler staple "$BUILD_PATH/$DMG_NAME"

      - name: Get build number and version
        id: build_info
        run: |
          # Extract from Info.plist in the built app
          BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$BUILD_PATH/$APP_NAME/Contents/Info.plist")
          SHORT_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$BUILD_PATH/$APP_NAME/Contents/Info.plist")
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "short_version=$SHORT_VERSION" >> $GITHUB_OUTPUT
          echo "Built version: $SHORT_VERSION ($BUILD_NUMBER)"

      - name: Generate release notes
        id: release_notes
        run: |
          # Get commits since last tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s" $PREV_TAG..HEAD --no-merges)
          else
            COMMITS=$(git log --pretty=format:"- %s" -10 --no-merges)
          fi

          # Create release notes file
          cat > release_notes.md << EOF
          ## What's New in ${{ steps.version.outputs.version }}

          $COMMITS

          ---

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREV_TAG...${{ steps.version.outputs.tag }}
          EOF

          echo "Generated release notes"

      - name: Sign update with EdDSA key
        id: sign_update
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # Find sign_update tool from Sparkle package
          SIGN_UPDATE=$(find build -name "sign_update" -type f | head -1)

          if [ -z "$SIGN_UPDATE" ]; then
            echo "sign_update tool not found, downloading Sparkle..."
            curl -sL https://github.com/sparkle-project/Sparkle/releases/latest/download/Sparkle-2.6.4.tar.xz | tar xJ -C /tmp
            SIGN_UPDATE="/tmp/Sparkle.framework/Versions/B/bin/sign_update"
          fi

          # Sign the update archive - sign_update outputs: sparkle:edSignature="..." length="..."
          # We need to extract just the signature value
          FULL_OUTPUT=$("$SIGN_UPDATE" "$BUILD_PATH/$ZIP_NAME" --ed-key-file <(echo "$SPARKLE_PRIVATE_KEY"))
          # Extract just the base64 signature from between the quotes
          SIGNATURE=$(echo "$FULL_OUTPUT" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          echo "signature=$SIGNATURE" >> $GITHUB_OUTPUT
          echo "Generated EdDSA signature for update"

      - name: Update appcast.xml
        env:
          SHORT_VERSION: ${{ steps.build_info.outputs.short_version }}
          BUILD_NUMBER: ${{ steps.build_info.outputs.build_number }}
          TAG: ${{ steps.version.outputs.tag }}
          ED_SIGNATURE: ${{ steps.sign_update.outputs.signature }}
        run: |
          # Get file size
          FILE_SIZE=$(stat -f%z "$BUILD_PATH/$ZIP_NAME")

          # Get current date
          PUB_DATE=$(date +"%Y-%m-%d")

          # Generate release notes HTML from commits
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS_HTML=$(git log --pretty=format:"<li>%s</li>" $PREV_TAG..HEAD --no-merges | head -20)
          else
            COMMITS_HTML=$(git log --pretty=format:"<li>%s</li>" -10 --no-merges)
          fi

          # Create new item entry in a temp file
          cat > /tmp/new_item.xml << ITEMEOF
              <item>
                <title>$SHORT_VERSION</title>
                <description>
                  <![CDATA[
                    <ul>
                      $COMMITS_HTML
                    </ul>
                  ]]>
                </description>
                <pubDate>$PUB_DATE</pubDate>
                <releaseNotesLink>https://github.com/${{ github.repository }}/releases/tag/$TAG</releaseNotesLink>
                <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
                <enclosure
                  url="https://github.com/${{ github.repository }}/releases/download/$TAG/$ZIP_NAME"
                  sparkle:version="$BUILD_NUMBER"
                  sparkle:shortVersionString="$SHORT_VERSION"
                  sparkle:edSignature="$ED_SIGNATURE"
                  length="$FILE_SIZE"
                  type="application/octet-stream"
                />
              </item>
          ITEMEOF

          # Insert new item after <language>en</language> line using sed
          sed -i '' '/<language>en<\/language>/r /tmp/new_item.xml' appcast.xml

          echo "Updated appcast.xml with new entry and EdDSA signature"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "nozzle ${{ steps.version.outputs.version }}"
          body_path: release_notes.md
          files: |
            ${{ env.BUILD_PATH }}/${{ env.ZIP_NAME }}
            ${{ env.BUILD_PATH }}/${{ env.DMG_NAME }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit appcast.xml update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create a temporary directory for the main branch
          TEMP_DIR=$(mktemp -d)

          # Clone just the main branch (shallow)
          git clone --depth 1 --branch main "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$TEMP_DIR"

          # Copy updated appcast.xml to the clone
          cp appcast.xml "$TEMP_DIR/appcast.xml"

          # Commit and push from the clone
          cd "$TEMP_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "Update appcast.xml for version ${{ steps.version.outputs.version }}"
          git push origin main

          # Cleanup
          rm -rf "$TEMP_DIR"

      - name: Cleanup keychain
        if: always()
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f $RUNNER_TEMP/certificate.p12 2>/dev/null || true
