name: Build and Release

on:
  push:
    tags:
      - 'v*'

env:
  SCHEME: nozzle
  PROJECT: nozzle.xcodeproj
  ARCHIVE_PATH: build/nozzle.xcarchive
  EXPORT_PATH: build/export
  APP_NAME: nozzle.app
  ZIP_NAME: nozzle.app.zip

jobs:
  build-and-release:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Apple certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          # Create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decode certificate
          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate to keychain
          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME"

      - name: Build archive
        run: |
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_STYLE=Manual \
            "CODE_SIGN_IDENTITY=Developer ID Application: Conor O'Meara (${{ secrets.APPLE_TEAM_ID }})" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime"

      - name: Export archive
        run: |
          # Create export options plist
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>developer-id</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Developer ID Application</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$EXPORT_PATH"

      - name: Create release zip
        run: |
          cd "$EXPORT_PATH"
          ditto -c -k --keepParent "$APP_NAME" "$ZIP_NAME"

      # TODO: Re-enable notarization once Apple entitlements issue is resolved
      # - name: Notarize app
      #   env:
      #     APPLE_ID: ${{ secrets.APPLE_ID }}
      #     APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      #     APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      #   run: |
      #     # Submit for notarization
      #     xcrun notarytool submit "$EXPORT_PATH/$ZIP_NAME" \
      #       --apple-id "$APPLE_ID" \
      #       --password "$APPLE_APP_SPECIFIC_PASSWORD" \
      #       --team-id "$APPLE_TEAM_ID" \
      #       --wait
      #
      #     # Staple the notarization ticket
      #     xcrun stapler staple "$EXPORT_PATH/$APP_NAME"
      #
      #     # Re-create zip with stapled app
      #     rm "$EXPORT_PATH/$ZIP_NAME"
      #     cd "$EXPORT_PATH"
      #     ditto -c -k --keepParent "$APP_NAME" "$ZIP_NAME"

      - name: Get build number and version
        id: build_info
        run: |
          # Extract from Info.plist in the built app
          BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$EXPORT_PATH/$APP_NAME/Contents/Info.plist")
          SHORT_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$EXPORT_PATH/$APP_NAME/Contents/Info.plist")
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "short_version=$SHORT_VERSION" >> $GITHUB_OUTPUT
          echo "Built version: $SHORT_VERSION ($BUILD_NUMBER)"

      - name: Generate release notes
        id: release_notes
        run: |
          # Get commits since last tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s" $PREV_TAG..HEAD --no-merges)
          else
            COMMITS=$(git log --pretty=format:"- %s" -10 --no-merges)
          fi

          # Create release notes file
          cat > release_notes.md << EOF
          ## What's New in ${{ steps.version.outputs.version }}

          $COMMITS

          ---

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREV_TAG...${{ steps.version.outputs.tag }}
          EOF

          echo "Generated release notes"

      - name: Update appcast.xml
        env:
          SHORT_VERSION: ${{ steps.build_info.outputs.short_version }}
          BUILD_NUMBER: ${{ steps.build_info.outputs.build_number }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Get file size
          FILE_SIZE=$(stat -f%z "$EXPORT_PATH/$ZIP_NAME")

          # Get current date
          PUB_DATE=$(date +"%Y-%m-%d")

          # Generate release notes HTML from commits
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS_HTML=$(git log --pretty=format:"<li>%s</li>" $PREV_TAG..HEAD --no-merges | head -20)
          else
            COMMITS_HTML=$(git log --pretty=format:"<li>%s</li>" -10 --no-merges)
          fi

          # Create new item entry
          NEW_ITEM="    <item>
            <title>$SHORT_VERSION</title>
            <description>
              <![CDATA[
                <ul>
                  $COMMITS_HTML
                </ul>
              ]]>
            </description>
            <pubDate>$PUB_DATE</pubDate>
            <releaseNotesLink>https://github.com/${{ github.repository }}/releases/tag/$TAG</releaseNotesLink>
            <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
            <enclosure
              url=\"https://github.com/${{ github.repository }}/releases/download/$TAG/$ZIP_NAME\"
              sparkle:version=\"$BUILD_NUMBER\"
              sparkle:shortVersionString=\"$SHORT_VERSION\"
              length=\"$FILE_SIZE\"
              type=\"application/octet-stream\"
            />
          </item>"

          # Insert new item after <language>en</language> line
          awk -v new_item="$NEW_ITEM" '
            /<language>en<\/language>/ {
              print
              print new_item
              next
            }
            { print }
          ' appcast.xml > appcast_new.xml

          mv appcast_new.xml appcast.xml

          echo "Updated appcast.xml with new entry"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "nozzle ${{ steps.version.outputs.version }}"
          body_path: release_notes.md
          files: |
            ${{ env.EXPORT_PATH }}/${{ env.ZIP_NAME }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit appcast.xml update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch and checkout main branch
          git fetch origin main
          git checkout main

          # Stage and commit appcast.xml
          git add appcast.xml
          git commit -m "Update appcast.xml for version ${{ steps.version.outputs.version }}"
          git push origin main

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
